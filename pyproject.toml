[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kabbalah"
dynamic = ["version"]
description = "Zero-trust governance kernel for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Charles Nóbrega" },
]
keywords = [
  "ai-agents",
  "mcp",
  "governance",
  "zero-trust",
  "sillytavern",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "python-dotenv>=1.0.1,<2.0.0",
  "pydantic>=2.10.5,<3.0.0",
  "pydantic-settings>=2.5.2,<3.0.0",
  "requests>=2.31.0,<3.0.0",
  "pyyaml==6.0.1",
  "protobuf==3.20.3",
  "google-api-core==1.34.1",
  "googleapis-common-protos>=1.57,<2.0dev",
  "grpcio-status==1.48.2",
  "click>=8.1.7,<9.0.0",
  "rich==13.7.0",
  "psutil==5.9.6",
  "keyring>=25.0.0,<26.0.0",
  "cryptography>=42.0.0",
  "openai>=1.80.1,<3.0.0",
  "google-generativeai==0.3.0",
  "groq>=0.4.0,<1.0.0",
  "mistralai==0.4.2",
  "together==0.2.11",
  "opentelemetry-api>=1.20.0,<2.0.0",
  "opentelemetry-sdk>=1.20.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.0",
  "pytest-cov==4.1.0",
  "pytest-asyncio==0.21.0",
  "hypothesis==6.88.0",
  "black==23.11.0",
  "flake8==6.1.0",
  "mypy==1.7.0",
  "isort==5.13.0",
  "ruff==0.6.9",
  "tomli>=2.0.1; python_version < '3.11'",
]
docs = [
  "sphinx>=7.0.0",
  "sphinx-rtd-theme>=1.3.0",
]
mcp = [
  "mcp>=1.9.0,<2.0.0",
]
memory = [
  "cognee==1.2.1",
  "openai==2.30.0",
  "requests==2.34.2",
  "litellm==1.83.7",
  "click==8.1.8",
]
observability = [
  "opentelemetry-exporter-prometheus>=0.41b0,<1.0.0",
  "prometheus-client==0.25.0",
]

[project.scripts]
kabbalah = "kabbalah.cli:main"

[project.urls]
Homepage = "https://github.com/charlesnobrega/kabbalah"
Repository = "https://github.com/charlesnobrega/kabbalah"
Issues = "https://github.com/charlesnobrega/kabbalah/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "kabbalah.__version__" }
